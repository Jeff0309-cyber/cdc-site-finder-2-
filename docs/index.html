<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CDC Site Finder</title>
  <meta name="description" content="Where should Café de Coral open next? The web version of the CDC Site Finder app: every street block in Hong Kong scored, a ranked shortlist, and the team's tools to review, decide and learn.">
  <meta name="theme-color" content="#4A2511">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/engine.js" defer></script>
  <script src="js/model.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/ui.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#sheet">Skip to the results</a>

  <div id="map" class="map" aria-label="Map of Hong Kong with the demand score of every street block"></div>

  <div class="overlay" id="overlay">
    <div class="search" id="search-area">
      <div class="search-bar">
        <span class="search-icon" id="search-icon"></span>
        <input id="search" type="search" placeholder="Search spots, stores, schools, MTR" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
               aria-label="Search spots, stores, schools, MTR" aria-controls="search-panel" aria-expanded="false">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden></button>
      </div>
      <div id="search-panel" class="search-panel" hidden></div>
    </div>
    <div id="chips" class="chips" role="group" aria-label="Map layers"></div>
    <div class="overlay-row">
      <div class="overlay-left">
        <div id="legend" class="legend material" aria-label="Demand score legend, from low (light yellow) to high (dark orange)">
          <span class="legend-title">Demand score</span>
          <span class="legend-scale"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="legend-ends"><span>Low</span><span>High</span></span>
        </div>
        <div id="hidden-pins" class="hidden-pins material" hidden></div>
      </div>
      <div id="map-buttons" class="map-buttons material"></div>
    </div>
  </div>

  <div id="toast" class="toast material" role="status" aria-live="polite" hidden></div>

  <section id="sheet" class="sheet" data-detent="peek" aria-label="Results" tabindex="-1">
    <div id="sheet-handle" class="sheet-handle" role="button" tabindex="0" aria-label="Drag or press to resize the results panel"><span></span></div>
    <header id="sheet-nav" class="sheet-nav" hidden>
      <button id="sheet-back" class="nav-back material" type="button" aria-label="Back"></button>
      <h1 id="sheet-title" class="nav-title"></h1>
    </header>
    <div id="sheet-body" class="sheet-body">
      <p class="loading">Loading the map data…</p>
      <noscript><p class="loading">This page needs JavaScript to show the map.</p></noscript>
    </div>
  </section>

  <dialog id="controls" class="dialog controls-dialog" aria-labelledby="controls-title"></dialog>
  <dialog id="report" class="dialog report-dialog" aria-labelledby="report-title"></dialog>
  <dialog id="confirm" class="dialog confirm-dialog" aria-labelledby="confirm-title"></dialog>
</body>
</html>
